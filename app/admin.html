<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Maison Vivat · Tableau de bord</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_commun/maison.css?v=11">
<link rel="stylesheet" href="app.css?v=17">
<style>
  .adm { max-width: 1200px; margin: 0 auto; padding: 24px 16px 80px; }
  .adm h1 { margin: 0 0 4px; }
  .adm h2 { font-family: "Cormorant Garamond", serif; font-size: 1.6rem; margin: 36px 0 12px; }
  .adm-periode { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 20px; }
  .adm-periode button { border: 1px solid #C9A86A; background: none; padding: 6px 14px; border-radius: 99px; cursor: pointer; font: inherit; }
  .adm-periode button[aria-pressed="true"] { background: #16130F; color: #F6F0E6; border-color: #16130F; }
  .adm-tuiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .adm-tuile { background: #fff; border: 1px solid #E8E1CF; border-radius: 14px; padding: 14px 16px; }
  .adm-tuile b { display: block; font-size: 1.9rem; font-family: "Cormorant Garamond", serif; line-height: 1.1; }
  .adm-tuile span { color: #6B6358; font-size: .85rem; }
  .adm-barres { display: flex; align-items: flex-end; gap: 3px; height: 140px; background: #fff; border: 1px solid #E8E1CF; border-radius: 14px; padding: 12px; overflow-x: auto; }
  .adm-barres div { flex: 1 0 8px; background: #C9A86A; border-radius: 3px 3px 0 0; min-height: 2px; }
  .adm-deux { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  .adm table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #E8E1CF; border-radius: 14px; overflow: hidden; font-size: .9rem; }
  .adm th, .adm td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #F0EADC; vertical-align: top; }
  .adm th { background: #F6F0E6; font-weight: 500; }
  .adm td.n { text-align: right; white-space: nowrap; }
  .adm-defile { overflow-x: auto; }
  .adm-vide { color: #6B6358; font-style: italic; }
  .adm-pastille { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: .78rem; background: #F0EADC; }
  .adm-pastille.paye { background: #DDEFD9; } .adm-pastille.ouvert { background: #F8E3C8; }
</style>
</head>
<body>
<header class="entete"><div class="conteneur">
  <a class="marque" href="admin.html"><b>Maison Vivat</b><span>Tableau de bord</span></a>
  <nav class="nav" aria-label="Compte"><a href="#" id="b-sortir" hidden>Se déconnecter</a></nav>
</div></header>
<main class="app" id="vue"></main>
<script type="module" src="admin.js?v=1"></script>
</body>
</html>
