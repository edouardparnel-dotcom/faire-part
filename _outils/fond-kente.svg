<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Kente : bandes tissées or, vert, rouge, noir -->
    <pattern id="kente" width="150" height="120" patternUnits="userSpaceOnUse">
      <rect width="150" height="120" fill="#D4A017"/>
      <rect x="0" y="0" width="150" height="16" fill="#0B6E4F"/>
      <rect x="0" y="104" width="150" height="16" fill="#0B6E4F"/>
      <rect x="0" y="16" width="150" height="6" fill="#111"/>
      <rect x="0" y="98" width="150" height="6" fill="#111"/>
      <rect x="20" y="30" width="40" height="60" fill="#B3001B"/>
      <rect x="90" y="30" width="40" height="60" fill="#0B6E4F"/>
      <path d="M20 60 L40 40 L60 60 L40 80Z" fill="#D4A017"/>
      <path d="M90 60 L110 40 L130 60 L110 80Z" fill="#111"/>
      <rect x="70" y="22" width="10" height="76" fill="#111"/>
      <rect x="72" y="30" width="6" height="8" fill="#D4A017"/><rect x="72" y="46" width="6" height="8" fill="#D4A017"/><rect x="72" y="62" width="6" height="8" fill="#D4A017"/><rect x="72" y="78" width="6" height="8" fill="#D4A017"/>
    </pattern>
    <linearGradient id="voile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0A0A" stop-opacity="0.25"/>
      <stop offset="0.55" stop-color="#0A0A0A" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#050505" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1600" fill="url(#kente)"/>
  <rect width="900" height="1600" fill="url(#voile)"/>
  <!-- Symbole adinkra Akoma (le cœur : patience, amour), stylisé -->
  <g transform="translate(450 330)" fill="none" stroke="#F5D06F" stroke-width="10" stroke-linejoin="round">
    <path d="M0 110 C -150 10, -150 -110, -60 -110 C -25 -110, 0 -80, 0 -55 C 0 -80, 25 -110, 60 -110 C 150 -110, 150 10, 0 110Z"/>
    <path d="M-30 -30 C -30 -60, 30 -60, 30 -30 C 30 0, -10 0, -10 -25" stroke-width="7"/>
  </g>
  <g fill="#F5D06F" opacity="0.9">
    <circle cx="300" cy="330" r="6"/><circle cx="600" cy="330" r="6"/>
  </g>
</svg>
