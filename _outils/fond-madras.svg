<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Madras : carreaux jaune, rouge, orange, vert, fils fins blancs -->
    <pattern id="madras" width="180" height="180" patternUnits="userSpaceOnUse">
      <rect width="180" height="180" fill="#E9A800"/>
      <rect x="0" y="0" width="70" height="180" fill="#D62828" opacity="0.55"/>
      <rect x="0" y="0" width="180" height="70" fill="#D62828" opacity="0.55"/>
      <rect x="100" y="0" width="34" height="180" fill="#F77F00" opacity="0.6"/>
      <rect x="0" y="100" width="180" height="34" fill="#F77F00" opacity="0.6"/>
      <rect x="150" y="0" width="14" height="180" fill="#2A9D8F" opacity="0.7"/>
      <rect x="0" y="150" width="180" height="14" fill="#2A9D8F" opacity="0.7"/>
      <rect x="84" y="0" width="3" height="180" fill="#FFF8E7" opacity="0.8"/>
      <rect x="0" y="84" width="180" height="3" fill="#FFF8E7" opacity="0.8"/>
      <rect x="32" y="0" width="2" height="180" fill="#1B1B1B" opacity="0.35"/>
      <rect x="0" y="32" width="180" height="2" fill="#1B1B1B" opacity="0.35"/>
    </pattern>
    <linearGradient id="voile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A0D0D" stop-opacity="0.15"/>
      <stop offset="0.55" stop-color="#3A0D0D" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2A0808" stop-opacity="0.85"/>
    </linearGradient>
    <g id="anthurium">
      <path d="M0 0 C -60 -50, -70 -120, -10 -110 C 0 -125, 30 -130, 45 -110 C 95 -90, 70 -30, 0 0Z" fill="#C1121F"/>
      <path d="M0 -20 C 8 -60, 18 -90, 32 -118" stroke="#F4D35E" stroke-width="10" stroke-linecap="round" fill="none"/>
      <path d="M0 0 C 5 40, 8 80, 6 140" stroke="#2D6A4F" stroke-width="6" fill="none"/>
    </g>
  </defs>
  <rect width="900" height="1600" fill="url(#madras)"/>
  <rect width="900" height="1600" fill="url(#voile)"/>
  <!-- Bande de dentelle façon lambrequin de case créole -->
  <g fill="#FFF8E7" opacity="0.92">
    <rect x="0" y="0" width="900" height="70"/>
    <path d="M0 70 q 30 40 60 0 q 30 40 60 0 q 30 40 60 0 q 30 40 60 0 q 30 40 60 0 q 30 40 60 0 q 30 40 60 0 q 30 40 60 0 q 30 40 60 0 q 30 40 60 0 q 30 40 60 0 q 30 40 60 0 q 30 40 60 0 q 30 40 60 0 q 30 40 60 0 V70Z"/>
  </g>
  <g fill="#E9A800" opacity="0.9">
    <circle cx="30" cy="80" r="5"/><circle cx="90" cy="80" r="5"/><circle cx="150" cy="80" r="5"/><circle cx="210" cy="80" r="5"/><circle cx="270" cy="80" r="5"/><circle cx="330" cy="80" r="5"/><circle cx="390" cy="80" r="5"/><circle cx="450" cy="80" r="5"/><circle cx="510" cy="80" r="5"/><circle cx="570" cy="80" r="5"/><circle cx="630" cy="80" r="5"/><circle cx="690" cy="80" r="5"/><circle cx="750" cy="80" r="5"/><circle cx="810" cy="80" r="5"/><circle cx="870" cy="80" r="5"/>
  </g>
  <use href="#anthurium" transform="translate(120 420) rotate(-15)"/>
  <use href="#anthurium" transform="translate(800 560) rotate(20) scale(0.8)"/>
  <use href="#anthurium" transform="translate(180 640) rotate(10) scale(0.55)"/>
</svg>
